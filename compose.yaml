services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cinema
      MYSQL_USER: cinema
      MYSQL_PASSWORD: ${CINEMA_DB_PASSWORD:?Set CINEMA_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      CINEMA_DB_URL: jdbc:mysql://db:3306/cinema?connectionTimeZone=UTC
      CINEMA_DB_USER: cinema
      CINEMA_DB_PASSWORD: ${CINEMA_DB_PASSWORD:?Set CINEMA_DB_PASSWORD}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://localhost:8080/movies]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s
volumes:
  mysql-data:
